<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
    <defs>
        <linearGradient id="eaLinearGrad" x1="0%" y1="20%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#072B6A" />
            <stop offset="25%" stop-color="#0284C7" />
            <stop offset="65%" stop-color="#00C0D4" />
            <stop offset="100%" stop-color="#2DD4BF" />
        </linearGradient>
        <linearGradient id="arrowGrad" x1="20%" y1="100%" x2="80%" y2="0%">
            <stop offset="0%" stop-color="#034FA2" />
            <stop offset="60%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
        <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C0D4" flood-opacity="0.25"/>
        </filter>
    </defs>

    <g id="ea-monogram" filter="url(#subtleGlow)">
        <!-- E Shape: Top Bar -->
        <path d="M 60 70 
                 C 40 70, 30 80, 30 100 
                 L 30 170 
                 L 190 170 
                 C 200 170, 208 162, 208 152 
                 C 208 142, 200 134, 190 134 
                 L 64 134 
                 L 64 102 
                 C 64 94, 70 88, 78 88 
                 L 195 88 
                 C 204 88, 212 80, 212 70 
                 L 60 70 Z" 
              fill="url(#eaLinearGrad)" />

        <!-- E Shape: Middle Bar (Pill) -->
        <rect x="74" y="146" width="90" height="20" rx="10" fill="url(#eaLinearGrad)" />

        <!-- E Shape: Lower Circuit Bar & Traces -->
        <path d="M 30 185 
                 L 30 230 
                 C 30 248, 42 258, 60 258 
                 L 165 258 
                 C 178 258, 188 252, 195 242 
                 L 225 198 
                 C 230 190, 238 186, 248 186 
                 L 270 186" 
              stroke="url(#eaLinearGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />

        <!-- E Circuit Terminal Node 1 -->
        <circle cx="272" cy="186" r="9" fill="url(#eaLinearGrad)" />

        <!-- E Circuit Baseline Trace -->
        <path d="M 45 220 L 165 220" 
              stroke="url(#eaLinearGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
        <circle cx="36" cy="220" r="8" fill="url(#eaLinearGrad)" />

        <!-- E Circuit Upper Node Accent -->
        <path d="M 185 130 L 230 80 L 250 80" 
              stroke="url(#eaLinearGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="252" cy="80" r="7" fill="url(#eaLinearGrad)" />

        <!-- A Shape: Outer Right Leg & Apex -->
        <path d="M 285 70 
                 C 275 70, 268 76, 265 84 
                 L 205 175 
                 L 230 175 
                 L 278 102 
                 L 358 245 
                 C 362 252, 370 258, 380 258 
                 L 395 258 
                 L 285 70 Z" 
              fill="url(#eaLinearGrad)" />

        <!-- A Shape: Inner Dynamic Soaring Arrow -->
        <path d="M 220 258 
                 C 240 255, 260 240, 275 210 
                 L 290 180 
                 L 270 180 
                 L 305 130 
                 L 330 190 
                 L 308 190 
                 C 292 225, 270 252, 240 258 
                 Z" 
              fill="url(#arrowGrad)" />

        <!-- A Arrow Launch Spark Accent -->
        <circle cx="295" cy="245" r="6" fill="#38BDF8" />
    </g>
</svg>
