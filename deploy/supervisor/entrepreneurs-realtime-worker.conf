; =============================================================================
; Entrepreneurs Automation SaaS — Realtime Worker Supervisor Configuration
; Target Workloads: Customer Live Chat, Instant FAQ Answering (Sub-second latency)
; Queues: messenger, faq
; =============================================================================

[program:entrepreneurs-realtime-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/entrepreneurs-automation/artisan queue:work database --queue=messenger,faq --sleep=1 --tries=3 --timeout=120 --max-time=3600 --memory=256
directory=/var/www/entrepreneurs-automation
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/realtime-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; Graceful Shutdown: stopwaitsecs MUST exceed worker timeout (120s) with safety buffer
stopwaitsecs=150
stopsignal=SIGTERM
environment=APP_ENV="production",APP_DEBUG="false"
