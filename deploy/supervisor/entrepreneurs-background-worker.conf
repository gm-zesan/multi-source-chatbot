; =============================================================================
; Entrepreneurs Automation SaaS — Background Worker Supervisor Configuration
; Target Workloads: CRM Extraction, Retention Outreach, Memory Ingestion, Spreadsheet Imports
; Queues: crm, retention, memory, default, documents
; =============================================================================

[program:entrepreneurs-background-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/entrepreneurs-automation/artisan queue:work database --queue=crm,retention,memory,default,documents --sleep=3 --tries=3 --timeout=320 --max-time=3600 --memory=512
directory=/var/www/entrepreneurs-automation
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/background-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; Graceful Shutdown: stopwaitsecs MUST exceed worker timeout (320s) with safety buffer
stopwaitsecs=380
stopsignal=SIGTERM
environment=APP_ENV="production",APP_DEBUG="false"
